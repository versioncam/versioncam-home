name: Site

# Every pull request and push builds the site, as a check: the docs from
# versioncam as npm publishes it, then Astro. It deploys nothing, and this
# repository holds no Cloudflare credential. Cloudflare's Workers Builds
# builds and deploys every push to main, and version.cam's cloud asks it for
# one more build each morning through a deploy hook, so a new release of
# versioncam is on the site by the next morning.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
